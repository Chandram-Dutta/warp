name: Warp Local-Only CI

on:
  push:
    branches:
      - 'warp-local-only/**'
  pull_request:
    paths:
      - '.github/workflows/local_only.yml'
      - 'app/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'script/check-local-only-dependencies.py'
      - 'script/macos/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-only:
    name: Build and test warp-local-only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare Linux environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: linux
          is_self_hosted: false
          install_test_deps: true
          cache_key: local-only-linux

      - name: Verify Cargo metadata and dependency boundaries
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          python3 script/check-local-only-dependencies.py

      - name: Check local-only binary
        run: >-
          cargo check --locked -p warp --bin warp-local-only
          --no-default-features --features local_only

      - name: Run focused local AI provider tests
        run: cargo test --locked -p warp_local_ai

      - name: Run focused local-only boundary tests
        run: |
          cargo test --locked -p warp_core --features local_only local_only
          cargo test --locked -p warp_core cli_agent_protocol
          cargo test --locked -p warp_features --features local_only local_only_profile
          cargo test --locked -p warp_server_auth --features local_only local_only_state
          cargo test --locked -p warp --lib --no-default-features --features local_only local_only
          cargo test --locked -p warp --lib --no-default-features --features local_only \
            terminal_local_scope_skips_agent_rows_and_preserves_terminal_state
          cargo test --locked -p warp --lib --no-default-features --features local_only \
            settings::local_ai::tests

      - name: Build local-only binary
        run: >-
          cargo build --locked -p warp --bin warp-local-only
          --no-default-features --features local_only

      - name: Package local-only binary
        run: tar -C target/debug -czf warp-local-only-linux-x86_64.tar.gz warp-local-only

      - name: Upload local-only binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warp-local-only-linux-x86_64-${{ github.sha }}
          path: warp-local-only-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos-local-only:
    name: Build ad-hoc signed warp-local-only DMG (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare macOS environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: macos
          is_self_hosted: false
          install_release_deps: true
          cache_key: local-only-macos-arm64

      - name: Verify ARM64 runner and install Rust target
        run: |
          test "$(uname -m)" = arm64
          rustup target add aarch64-apple-darwin

      - name: Install app packaging tools
        run: |
          script/install_cargo_bundle
          brew install create-dmg

      - name: Build ad-hoc signed app and DMG
        id: bundle
        env:
          SKIP_SETTINGS_SCHEMA: 1
        run: >-
          script/bundle --channel local-only --arch aarch64 --debug --adhoc-sign
          --dmg-name-suffix arm64

      - name: Validate app signature, architecture, and DMG
        run: |
          app=target/aarch64-apple-darwin/debug/bundle/osx/WarpLocalOnly.app
          executable="$app/Contents/MacOS/warp-local-only"
          plugin="$app/Contents/PlugIns/WarpDockTilePlugin.docktileplugin"
          dmg="${{ steps.bundle.outputs.dmg_path }}"
          test -x "$executable"
          file "$executable" | grep -F 'arm64'
          lipo "$executable" -verify_arch arm64
          codesign --verify --deep --strict --verbose=4 "$app"
          codesign --verify --strict --verbose=4 "$plugin"
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/app-signature.txt
          grep -F 'Signature=adhoc' /tmp/app-signature.txt
          codesign -d --entitlements :- "$app" > /tmp/app-entitlements.plist
          plutil -lint /tmp/app-entitlements.plist
          codesign --verify --strict --verbose=4 "$dmg"
          hdiutil verify "$dmg"

          mount_dir="$(mktemp -d)"
          quarantine_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" || true; rm -rf "$mount_dir" "$quarantine_dir"' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          codesign --verify --deep --strict --verbose=4 "$mount_dir/WarpLocalOnly.app"
          file "$mount_dir/WarpLocalOnly.app/Contents/MacOS/warp-local-only" | grep -F 'arm64'
          lipo "$mount_dir/WarpLocalOnly.app/Contents/MacOS/warp-local-only" -verify_arch arm64
          ditto "$mount_dir/WarpLocalOnly.app" "$quarantine_dir/WarpLocalOnly.app"
          xattr -w com.apple.quarantine '0081;00000000;GitHubActions;' "$quarantine_dir/WarpLocalOnly.app"
          xattr -p com.apple.quarantine "$quarantine_dir/WarpLocalOnly.app"
          codesign --verify --deep --strict --verbose=4 "$quarantine_dir/WarpLocalOnly.app"
          spctl --assess --type execute --verbose=4 "$quarantine_dir/WarpLocalOnly.app" || \
            echo 'Expected: ad-hoc development builds are not Developer ID trusted or notarized.'
          xattr -dr com.apple.quarantine "$quarantine_dir/WarpLocalOnly.app"
          hdiutil detach "$mount_dir"
          rm -rf "$mount_dir" "$quarantine_dir"
          trap - EXIT

      - name: Smoke test direct and LaunchServices app launches
        id: launch-smoke
        run: >-
          script/macos/smoke_test_app
          target/aarch64-apple-darwin/debug/bundle/osx/WarpLocalOnly.app
          "${RUNNER_TEMP}/warp-local-only-launch-logs"

      - name: Upload failed launch diagnostics
        if: failure() && steps.launch-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warp-local-only-macos-arm64-launch-failure-${{ github.sha }}
          path: ${{ runner.temp }}/warp-local-only-launch-logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ad-hoc signed macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warp-local-only-macos-arm64-adhoc-${{ github.sha }}
          path: ${{ steps.bundle.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 14
